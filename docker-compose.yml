services:
  searxng:
    build: .               # build from Dockerfile in this repo
    # image: ghcr.io/foxy1402/searxng-env-vars:latest   # use pre-built image instead of building locally
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_PUBLIC_INSTANCE: ${SEARXNG_PUBLIC_INSTANCE}
      SEARXNG_LIMITER: ${SEARXNG_LIMITER}
      SEARXNG_IMAGE_PROXY: ${SEARXNG_IMAGE_PROXY}
      SEARXNG_METHOD: ${SEARXNG_METHOD}
      SEARXNG_DEBUG: ${SEARXNG_DEBUG}
    volumes:
      - searxng-data:/var/cache/searxng
    ports:
      - "8080:8080"

volumes:
  searxng-data:
